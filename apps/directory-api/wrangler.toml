name = "pdc-directory-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "e94739e74a35d0d91a23961063a74904"

# Incident fix (Session 40 hotfix follow-up, 2026-09-05): `wrangler deploy`
# treats local config as authoritative and overwrites the dashboard's routes
# and vars with whatever this file declares. Before this file declared
# `routes`, the very first post-migration deploy silently deleted the
# api.synergybcpacific.com custom-domain route the dashboard had configured
# — declaring it here is what keeps a future plain `wrangler deploy` from
# doing that again.
routes = [
  { pattern = "api.synergybcpacific.com", custom_domain = true }
]
# Wrangler disables the workers.dev URL by default once `routes` is set
# explicitly — re-enabled to match the dashboard's prior default (both the
# custom domain and the workers.dev URL were reachable before this file
# declared routes at all).
workers_dev = true

# Static assets (currently just the SBP logo, served for og:image on the
# branded GET / HTML response — see routes/branding.ts). Cloudflare serves
# any request matching a file under ./public directly, without invoking the
# Worker script at all, before falling through to `main` for everything
# else — so this needs no route/handler of its own.
[assets]
directory = "./public"

# Same incident: these vars were configured only via the dashboard, so the
# first deploy from this wrangler.toml (which only declared NODE_ENV) wiped
# all of them. Restored here as [vars] (not secrets — every value below is
# a public wallet address or public URL, never sensitive material per
# CLAUDE.md P4) so they're versioned and can't be silently dropped by a
# future deploy again. PORT is deliberately NOT restored: Workers doesn't
# bind a TCP port, and the stale dashboard value of 8080 (a Railway-era
# leftover) is exactly what caused discovery.ts's old localhost fallback to
# render "http://localhost:8080" in production — letting env.PORT fall back
# to its schema default (8787) is harmless since nothing here uses it.
[vars]
NODE_ENV = "production"
PUBLIC_URL = "https://api.synergybcpacific.com"
ALGORAND_NETWORK = "mainnet"
AVM_ADDRESS = "LN745UCDQNFIBDY6JFW7FNK333MADQZQVQFMCVR3GXXUTB52O2NYPZN3YY"
AGENT_WALLET_ADDRESS = "Q5XTALN45D32I572OZAVZ4FW6UYSW6A4FFAX4YOY6PP3YCD4JJJ3JQRYKI"
FACILITATOR_URL = "https://facilitator.goplausible.xyz"
ALGORAND_NODE_URL = "https://mainnet-api.algonode.cloud"
WEB_APP_URL = "https://pacific-data-commons-web-olive.vercel.app"
LOG_LEVEL = "info"

# KV-backed live crypto price feed (feat/kv-crypto-cron) — see
# src/handlers/cronCryptoPriceFetcher.ts and
# src/services/pacificCryptoRatesService.ts's doc comments for the full
# design. id/preview_id below are PLACEHOLDERS: this sandbox has no
# outbound network access to Cloudflare's API, so the real namespaces
# could not be created here. Anthony must run:
#   wrangler kv namespace create CRYPTO_PRICES_KV
#   wrangler kv namespace create CRYPTO_PRICES_KV --preview
# and replace 69654f39fa1343b4a3595ca6aa1fa5c8 / 82d04d89a603471d9eb3bb6bb7a11a27 below
# with the ids each command prints, before this is deployed — a deploy
# with the placeholders left in will fail (wrangler validates these ids
# against the account at deploy time).
[[kv_namespaces]]
binding = "CRYPTO_PRICES_KV"
id = "69654f39fa1343b4a3595ca6aa1fa5c8"
preview_id = "82d04d89a603471d9eb3bb6bb7a11a27"

# Cron Trigger for cronCryptoPriceFetcher.ts — every 5 minutes. Wired to
# worker.ts's `scheduled` export.
[triggers]
crons = ["*/5 * * * *"]

# Secret environment variables remain set via Cloudflare dashboard
# (Workers & Pages > pdc-directory-api > Settings > Variables and Secrets)
# — confirmed untouched by the incident deploy, since wrangler never
# overwrites encrypted Secrets from a [vars] block. DO NOT put actual
# secret values in this file. Secrets to confirm are still set (names only):
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# INTERNAL_API_KEY
# COMPLIANCE_API_KEY
# RESEND_API_KEY
# EMAIL_FROM
# NODELY_API_TOKEN
# AGENT_WALLET_KEY
# PILOT_ENDPOINT_URL
# ANTHROPIC_API_KEY
# CLAUDE_MODEL
