name = "pdc-directory-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "e94739e74a35d0d91a23961063a74904"

[vars]
NODE_ENV = "production"

# Secret environment variables are set via Cloudflare dashboard
# Workers & Pages > pdc-directory-api > Settings > Variables
# DO NOT put actual secret values in this file
# Variables to set in dashboard (names only — values from secrets folder):
# PUBLIC_URL
# ALGORAND_NETWORK
# AVM_ADDRESS
# FACILITATOR_URL
# AGENT_WALLET_ADDRESS
# WEB_APP_URL
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# INTERNAL_API_KEY
# COMPLIANCE_API_KEY
# RESEND_API_KEY
# EMAIL_FROM
# ALGORAND_NODE_URL
# NODELY_API_TOKEN
# AGENT_WALLET_KEY
# PILOT_ENDPOINT_URL
# ANTHROPIC_API_KEY
# CLAUDE_MODEL
