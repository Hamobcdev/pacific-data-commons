name = "pdc-pilot-endpoint"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "e94739e74a35d0d91a23961063a74904"

# Same wrangler.toml pattern fix applied to directory-api after its
# variable-wipe incident (2026-09-05): non-secret config declared here as
# versioned [vars] instead of dashboard-only click-ops, so a future
# `wrangler deploy` can't silently drop it. Unlike directory-api, this
# worker has never been deployed before (confirmed via
# `wrangler deployments list` — "This Worker does not exist on your
# account"), so there was no existing dashboard config at risk here; this
# is a preventative fix, not an incident recovery.
#
# No public custom domain for this service (unchanged from the original
# migration plan) — reachable only at its workers.dev URL below.
[vars]
NODE_ENV = "production"
ALGORAND_NETWORK = "mainnet"
FACILITATOR_URL = "https://facilitator.goplausible.xyz"
PUBLIC_URL = "https://pdc-pilot-endpoint.synergyblockchaintf.workers.dev"
LOG_LEVEL = "info"
# SBP's payTo wallet — same address as directory-api's AVM_ADDRESS (that
# service's [vars], confirmed identical). Public wallet info, not a secret
# (see the incident note below this block for why it belongs here as a
# versioned var rather than a dashboard-only click-op).
AVM_ADDRESS = "LN745UCDQNFIBDY6JFW7FNK333MADQZQVQFMCVR3GXXUTB52O2NYPZN3YY"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true


# 2026-09-22 outage: this worker was serving 500 on every route (including
# /health) because AVM_ADDRESS and SUPABASE_URL were never actually set —
# neither was in [vars] (AVM_ADDRESS, now fixed above) nor present as a
# Cloudflare secret (`wrangler secret list` showed only
# SUPABASE_SERVICE_KEY). See apps/pilot-endpoint/DEPLOY.md for the full
# required-secrets list and how this class of outage is meant to be
# prevented going forward.
#
# Secret environment variables (true secrets, not public config) are set via
# `wrangler secret put <NAME> --name pdc-pilot-endpoint` or the Cloudflare
# dashboard (Workers & Pages > pdc-pilot-endpoint > Settings > Variables).
# DO NOT put actual secret values in this file.
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
