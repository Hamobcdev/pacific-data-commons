compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "e94739e74a35d0d91a23961063a74904"

[vars]
NODE_ENV = "production"

# Secret environment variables are set via Cloudflare dashboard
# Workers & Pages > pdc-pilot-endpoint > Settings > Variables
# DO NOT put actual secret values in this file
# Variables to set in dashboard (names only — values from secrets folder):
# ALGORAND_NETWORK
# AVM_ADDRESS
# FACILITATOR_URL
# PUBLIC_URL
# LOG_LEVEL
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
